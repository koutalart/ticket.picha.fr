# PICHA Ticket — production (https://ticket.picha.fr) sur le VPS 51.210.5.75.
# Même architecture que docker-compose.staging.yml, projet et ports distincts.
# Lancer depuis la racine du dépôt :
#   docker compose -p picha-ticket-prod -f docker/production/docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB: picha_ticket
      POSTGRES_USER: picha_ticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picha_ticket -d picha_ticket"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [picha-prod-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    networks: [picha-prod-net]

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: ../../backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [picha-prod-net]

  queue-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    mem_limit: 256m
    env_file: ../../backend/.env.production
    command: ["php", "artisan", "queue:work", "--queue=default,webhook-queue", "--tries=3", "--backoff=5"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [picha-prod-net]

  scheduler:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    mem_limit: 128m
    env_file: ../../backend/.env.production
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    networks: [picha-prod-net]

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.ssr
    restart: unless-stopped
    mem_limit: 512m
    env_file: ../../frontend/.env.production
    ports:
      - "127.0.0.1:3001:5678"
    depends_on: [backend]
    networks: [picha-prod-net]

networks:
  picha-prod-net:

volumes:
  pgdata:
  redisdata:
  backend_storage:
