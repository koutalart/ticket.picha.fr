# /etc/nginx/sites-available/ticket.picha.fr
# Activer : ln -s /etc/nginx/sites-available/ticket.picha.fr /etc/nginx/sites-enabled/
# HTTPS  : certbot --nginx -d ticket.picha.fr   (ajoute le bloc 443 et la redirection)
server {
    listen 80;
    listen [::]:80;
    server_name ticket.picha.fr;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
