# /etc/nginx/sites-available/ticket.picha.fr.conf — un seul domaine :
#   /api/  -> backend  (127.0.0.1:8081)
#   /      -> frontend (127.0.0.1:3001)
# HTTPS : sudo certbot --nginx -d ticket.picha.fr  (ajoute le bloc 443 et la redirection)
server {
    listen 80;
    listen [::]:80;
    server_name ticket.picha.fr;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
